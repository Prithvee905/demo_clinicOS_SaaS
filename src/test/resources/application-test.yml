spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    clean-disabled: false

# Override credentials for testing to avoid contacting real AWS/Meta
app:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
  whatsapp:
    phone-number-id: test-phone-id
    api-token: test-api-token
