server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinicsaas}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: ClinicSaasHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:motivebuilders@gmail.com}
    password: ${SMTP_PASSWORD:ogld jcne enbk yhwg}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:super-secret-key-that-is-at-least-256-bits-long-change-this-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  s3:
    endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
    region: ${S3_REGION:ap-south-1}
    bucket-name: ${S3_BUCKET_NAME:clinic-saas-pdf-storage}
    access-key: ${S3_ACCESS_KEY:mock-key}
    secret-key: ${S3_SECRET_KEY:mock-secret}
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:mock-phone-id}
    api-token: ${WHATSAPP_API_TOKEN:mock-token}
    template-name: ${WHATSAPP_TEMPLATE_NAME:invoice_delivery_template}
    language-code: ${WHATSAPP_LANGUAGE_CODE:en}
    send-params: ${WHATSAPP_SEND_PARAMS:false}

resilience4j:
  retry:
    instances:
      whatsappApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.RestClientResponseException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
      s3Upload:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - software.amazon.awssdk.core.exception.SdkException

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

