version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clinicsaas
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d clinicsaas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicos-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicsaas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      APP_JWT_SECRET: v9y$B&E)H@McQfTjWnZr4u7x!A%C*F-JaNdRgUkXp2s5v8y/B?D(G+KbPeShVmYq
      APP_JWT_EXPIRATION_MS: 3600000
      APP_S3_BUCKET: mock-bucket
      APP_S3_ACCESS_KEY: mock-access
      APP_S3_SECRET_KEY: mock-secret
      APP_S3_REGION: us-east-1
      APP_WHATSAPP_PHONE_NUMBER_ID: mock-phone-id
      APP_WHATSAPP_API_TOKEN: mock-token
      APP_WHATSAPP_TEMPLATE_NAME: invoice_template
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinicos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
